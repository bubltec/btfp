name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck build

      # Uploaded once here and reused by every later job — the whole point
      # of this pipeline is that dev and prod run the exact same build, not
      # two separate builds of the same source. See docs/ci-cd.md.
      - uses: actions/upload-artifact@v7
        with:
          name: bff-dist
          path: apps/bff/dist
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      BTFP_HOSTED_ZONE_ID: ${{ vars.BTFP_HOSTED_ZONE_ID }}
      BTFP_DEV_BASIC_AUTH_USER: ${{ secrets.BTFP_DEV_BASIC_AUTH_USER }}
      BTFP_DEV_BASIC_AUTH_PASSWORD: ${{ secrets.BTFP_DEV_BASIC_AUTH_PASSWORD }}
      BTFP_DEV_JWT_SECRET: ${{ secrets.BTFP_DEV_JWT_SECRET }}
      BTFP_PROD_JWT_SECRET: ${{ secrets.BTFP_PROD_JWT_SECRET }}
      BTFP_BRAVE_SEARCH_API_KEY: ${{ secrets.BTFP_BRAVE_SEARCH_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: bff-dist
          path: apps/bff/dist
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist

      # apps/scraper's Dockerfile only COPYs a pre-built dist/index.js, it
      # doesn't build it — needed before any cdk deploy/diff, since
      # ecs.ContainerImage.fromAsset builds the Docker image at synth time,
      # not just on deploy (so cdk diff needs this too, not just deploy).
      - run: pnpm --filter @btfp/scraper build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Docker build+push happens automatically inside this call (the BFF
      # Lambda is DockerImageCode.fromImageAsset — see api-stack.ts). Not
      # prerendered: dev is Basic-Auth-walled and noindex, never meant to be
      # crawled — see docs/seo.md.
      - name: cdk deploy BtfpDev
        working-directory: infra/cdk
        run: npx cdk deploy 'BtfpDev/*' --require-approval never

  e2e:
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Cache the ~150-300MB Chromium download separately from the OS-level
      # --with-deps libs, which can't be cached (fresh VM every run) but
      # install fast from the runner's local apt mirror regardless.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm --filter @btfp/e2e exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: pnpm --filter @btfp/e2e exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      # The exact invocation docs/e2e-testing.md already documents running
      # by hand — now automated. Note: this permanently accumulates test
      # data (a submitted thing, a signed-up user) in dev's real DynamoDB
      # tables on every run — an accepted tradeoff, see docs/ci-cd.md.
      - name: Run e2e against dev
        working-directory: apps/e2e
        env:
          BASE_URL: https://dev.badthingsforpets.com
          BASIC_AUTH_USER: ${{ secrets.BTFP_DEV_BASIC_AUTH_USER }}
          BASIC_AUTH_PASSWORD: ${{ secrets.BTFP_DEV_BASIC_AUTH_PASSWORD }}
        run: pnpm test

  prod-diff:
    needs: e2e
    runs-on: ubuntu-latest
    # Deliberately NOT gated by the `production` environment — this job
    # exists so the diff is visible in the Actions run *before* a reviewer
    # decides whether to approve deploy-prod, not alongside it. A diff
    # computed inside the gated job itself would only become visible after
    # the deploy already ran, which defeats the point. See docs/ci-cd.md.
    permissions:
      id-token: write
      contents: read
    env:
      BTFP_HOSTED_ZONE_ID: ${{ vars.BTFP_HOSTED_ZONE_ID }}
      BTFP_DEV_BASIC_AUTH_USER: ${{ secrets.BTFP_DEV_BASIC_AUTH_USER }}
      BTFP_DEV_BASIC_AUTH_PASSWORD: ${{ secrets.BTFP_DEV_BASIC_AUTH_PASSWORD }}
      BTFP_DEV_JWT_SECRET: ${{ secrets.BTFP_DEV_JWT_SECRET }}
      BTFP_PROD_JWT_SECRET: ${{ secrets.BTFP_PROD_JWT_SECRET }}
      BTFP_BRAVE_SEARCH_API_KEY: ${{ secrets.BTFP_BRAVE_SEARCH_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: bff-dist
          path: apps/bff/dist

      # See the matching comment in deploy-dev — needed for cdk diff too,
      # not just deploy.
      - run: pnpm --filter @btfp/scraper build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # BtfpCi included here too — deploy-prod now deploys it alongside
      # BtfpProd (it defines the deploy role's own IAM policy), so its diff
      # needs the same before-approval visibility as everything else this
      # job is about to change, not a silent exception.
      - name: cdk diff BtfpProd + BtfpCi
        working-directory: infra/cdk
        run: |
          echo '## BtfpProd diff' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx cdk diff 'BtfpProd/*' >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '## BtfpCi diff' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx cdk diff BtfpCi >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  deploy-prod:
    needs: prod-diff
    runs-on: ubuntu-latest
    # The real prod safety gate: a GitHub Environment with a required
    # reviewer (configured once in repo settings, not in this file — see
    # docs/ci-cd.md). This job doesn't start running at all until someone
    # approves, and by then prod-diff's summary above is already visible.
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      BTFP_HOSTED_ZONE_ID: ${{ vars.BTFP_HOSTED_ZONE_ID }}
      BTFP_DEV_BASIC_AUTH_USER: ${{ secrets.BTFP_DEV_BASIC_AUTH_USER }}
      BTFP_DEV_BASIC_AUTH_PASSWORD: ${{ secrets.BTFP_DEV_BASIC_AUTH_PASSWORD }}
      BTFP_DEV_JWT_SECRET: ${{ secrets.BTFP_DEV_JWT_SECRET }}
      BTFP_PROD_JWT_SECRET: ${{ secrets.BTFP_PROD_JWT_SECRET }}
      BTFP_BRAVE_SEARCH_API_KEY: ${{ secrets.BTFP_BRAVE_SEARCH_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Same artifacts the build job produced and dev already ran — a real
      # promotion, not a rebuild. See docs/ci-cd.md.
      - uses: actions/download-artifact@v8
        with:
          name: bff-dist
          path: apps/bff/dist
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist

      # See the matching comment in deploy-dev.
      - run: pnpm --filter @btfp/scraper build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Deployed here, not left as a one-off manual step: BtfpCi defines
      # this very deploy role's own IAM policy (see ci-stack.ts), so any
      # permission it grants — e.g. the DynamoDB access the seed step below
      # needs — has to actually be applied before it's used. IAM changes
      # take effect immediately for a role's *next* API call, so deploying
      # it first in the same job, using the same already-assumed session,
      # is enough — no separate step or session refresh needed. Gated by
      # the same prod approval as everything else in this job, same as any
      # other infra change reaching prod.
      - name: cdk deploy BtfpCi
        working-directory: infra/cdk
        run: npx cdk deploy BtfpCi --require-approval never

      - name: cdk deploy BtfpProd
        working-directory: infra/cdk
        run: npx cdk deploy 'BtfpProd/*' --require-approval never

      # Only the two datasets committed to this repo (curated hazards, dog
      # breeds) — the ASPCA plant/food dataset is gitignored (licensing, see
      # docs/data-sourcing.md) and CI has no copy of it, so run.ts skips it
      # here. That dataset stays a manual `pnpm seed:local`-style step
      # against prod from a machine that has it. Blind-overwrites every
      # curated row by its stable id on each run — see the "seed on merge"
      # discussion in docs/data-sourcing.md for what that trades off.
      - name: Seed prod content (breeds, curated hazards)
        working-directory: data/seed
        env:
          CONTENT_TABLE_NAME: btfp-prod-content
        run: pnpm exec tsx src/run.ts

  prerender-prod:
    needs: deploy-prod
    runs-on: ubuntu-latest
    # Deliberately NOT gated by the `production` environment — that would
    # require a second manual approval click even though deploy-prod (the
    # actual risky step) already got one, since GitHub's required-reviewer
    # gate triggers per job, not once per workflow run. All secrets used
    # here are repo-level (see deploy-dev, which also has no `environment:`
    # and uses the same secrets), so nothing is lost by skipping it. Split
    # into its own job so a slow/flaky prerender crawl can't hold the actual
    # "prod is deployed" job open.
    permissions:
      id-token: write
      contents: read
    env:
      BTFP_HOSTED_ZONE_ID: ${{ vars.BTFP_HOSTED_ZONE_ID }}
      BTFP_DEV_BASIC_AUTH_USER: ${{ secrets.BTFP_DEV_BASIC_AUTH_USER }}
      BTFP_DEV_BASIC_AUTH_PASSWORD: ${{ secrets.BTFP_DEV_BASIC_AUTH_PASSWORD }}
      BTFP_DEV_JWT_SECRET: ${{ secrets.BTFP_DEV_JWT_SECRET }}
      BTFP_PROD_JWT_SECRET: ${{ secrets.BTFP_PROD_JWT_SECRET }}
      BTFP_BRAVE_SEARCH_API_KEY: ${{ secrets.BTFP_BRAVE_SEARCH_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: bff-dist
          path: apps/bff/dist
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist

      # NOT part of either artifact: apps/web/dist is already a self-contained
      # bundle (vite inlines its dependencies at build time), so it doesn't
      # need this. But prerender.mjs below runs as a plain Node script
      # (import slugify from '@btfp/shared-types'), resolved at runtime via
      # the pnpm workspace symlink — which points at this package's source
      # checkout, not the artifact. `pnpm install` alone only wires up the
      # symlink; without this, `dist/index.js` doesn't exist yet.
      - run: pnpm --filter @btfp/shared-types build

      # See the matching comment in deploy-dev — needed for cdk synth here too.
      - run: pnpm --filter @btfp/scraper build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Two-pass: apps/web/dist deployed by deploy-prod is the generic
      # (unprerendered) shell. Now that BtfpProd/Api is live, crawl it for
      # real per-route HTML and re-deploy Web to sync those files — mirrors
      # docs/infra.md's existing manual step 9. If this job fails, prod is
      # left running new API/DB code with stale web assets — a visible (red
      # job), not silent, accepted risk; see docs/ci-cd.md for the manual
      # recovery path.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm --filter @btfp/web exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: pnpm --filter @btfp/web exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - name: Prerender against live prod API
        working-directory: apps/web
        env:
          PRERENDER_API_ORIGIN: https://badthingsforpets.com
        run: pnpm run prerender

      - name: cdk deploy BtfpProd/Web (sync prerendered assets)
        working-directory: infra/cdk
        run: npx cdk deploy BtfpProd/Web --require-approval never
